[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  # Netlify sets CI=true, which makes Create React App fail the build on any lint warning.
  CI = "false"
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# Same /api/* URLs as on Vercel, served by netlify/functions/api.js
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single-page app: /admin and any other path load index.html (real files still win)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
